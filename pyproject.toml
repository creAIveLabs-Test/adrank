[project]
name = "adrank"
version = "0.1.0"
description = "A miniature ads personalization platform: retrieval, calibrated pCTR, GSP auction, exploration, experiments."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[tool.uv]
package = false
